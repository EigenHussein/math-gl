[package]
name = "math-gl"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
bincode = "1.3.3"
gl = "0.14.0"
glfw = "0.55.0"
glm = "0.2.3"
rand = "0.8.5"
serde = { version = "1.0.197", features = ["derive"] }
serde_json = "1.0.114"
nalgebra-glm = "0.18.0"

math-gl-core = { path = "math-gl-core" }

ray-tracing = { path = "ray-tracing" }
assimp = "0.3.1"
opencv = "0.91.3"
linfa = "0.7.0"
linfa-svm = "0.7.0"
linfa-datasets = "0.7.0"
freetype-rs = "0.36.0"
image = "0.25.1"
imgui = "0.12.0"

# [build-dependencies]
# bindgen = "0.69.4"

[[bin]]

name = "main"
path = "src/main.rs"

[[bin]]

name = "wavelet_projection"
path = "src/wavelet_projection.rs"


[[bin]]
name = "wavelet_projection2"
path = "src/wavelet_projection2.rs"


[[bin]]
name = "bloom_test1"
path = "src/bloom_test1.rs"

[[bin]]
name = "bloom_test2"
path = "src/bloom_test2.rs"

[[bin]]
name = "raytracer"
path = "src/raytracer1.rs"

[[bin]]
name = "benchmark"
path = "src/benchmark.rs"


[[bin]]
name = "lattice"
path = "src/lattice_program/main.rs"


[[bin]]
name = "svm"
path = "src/SVM/main.rs"


[[bin]]
name = "text"
path = "src/text_rendering/main.rs"


[[bin]]
name = "latex"
path = "src/latex_rendering/main.rs"


[[bin]]

name = "imgui_test"
path = "src/imgui_test/main.rs"


[[bin]]

name = "plotter"
path = "src/plotter/main.rs"
